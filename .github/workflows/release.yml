name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm audit --audit-level=moderate
      - name: Check committed build
        run: git diff --exit-code -- main.js
      - name: Attest plugin build
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            main.js
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag
          --title "$RELEASE_TAG"
          --notes "LaTeX command completion for Obsidian math, with previews."
          main.js manifest.json styles.css
